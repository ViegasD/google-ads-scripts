[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "google-ads-agent-tools"
version = "0.1.0"
description = "High-level, approval-gated Google Ads tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-ads>=31.2.0,<32",
    "pydantic>=2.11,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["google_ads_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
